name: Update limited feed
on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          MAX_STOCK: "5"
        run: python3 limit_stock.py
      - name: Commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
